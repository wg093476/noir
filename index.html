<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
color:#fff;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
font-family:'JetBrains Mono',monospace;
}

.container{
width:90%;max-width:1100px;text-align:center;
flex:1;display:flex;flex-direction:column;justify-content:center;
padding:48px 0 0;
}

.logo{
font-family:'Pixelify Sans',sans-serif;
font-size:64px;
letter-spacing:14px;
margin-bottom:15px;
text-shadow:0 0 10px rgba(255,255,255,.15);
cursor:pointer;
user-select:none;
}

.tagline{color:#666;font-size:14px;margin-bottom:40px}

.search-wrap{position:relative;max-width:950px;margin:auto}

#search{
width:100%;
background:transparent;
border:none;
border-top:1px solid rgba(255,255,255,.15);
border-bottom:1px solid rgba(255,255,255,.15);
color:#fff;
text-align:center;
font-size:30px;
padding:28px 20px;
outline:none;
font-family:'JetBrains Mono',monospace;
}

.placeholder{
position:absolute;left:50%;top:50%;
transform:translate(-50%,-50%);
color:#8a8a8a;pointer-events:none;font-size:30px;white-space:nowrap;
}

.cursor{animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

.suggestions{
position:absolute;left:0;right:0;top:100%;
background:#000;
border-bottom:1px solid rgba(255,255,255,.15);
z-index:5;
display:none;
}
.suggestions button{
display:flex;align-items:center;gap:14px;
width:100%;padding:14px 24px;
background:none;border:none;color:#bbb;
font-family:inherit;font-size:16px;text-align:left;cursor:pointer;
}
.suggestions button:hover,.suggestions button.active{background:#0d0d0d;color:#fff}
.suggestions img{width:44px;height:28px;object-fit:cover;border-radius:3px;background:#111}

.brands{margin-top:18px;color:#444;font-size:12px}

/* brand tiles */
.tiles{
display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
width:100%;max-width:760px;margin:34px auto 0;
}
.tile{
background:none;border:none;cursor:pointer;color:#888;
font-family:inherit;font-size:12px;text-align:center;
}
.tile .face{
display:flex;align-items:center;justify-content:center;
aspect-ratio:1.6;border-radius:8px;margin-bottom:8px;
background:#0d0d0d center/cover no-repeat;
border:1px solid rgba(255,255,255,.08);
font-family:'Pixelify Sans',sans-serif;font-size:17px;letter-spacing:2px;color:#777;
transition:transform .15s ease,border-color .15s ease;
}
.tile:hover .face,.tile:focus-visible .face{transform:translateY(-2px);border-color:rgba(255,255,255,.35)}
.tile:hover,.tile:focus-visible{color:#fff;outline:none}
.tiles.loading .face{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.status{margin-top:18px;color:#777;font-size:13px;min-height:18px}

/* product view */
.card{
display:none;
text-align:center;
border:1px solid rgba(255,255,255,.15);
padding:40px;
width:100%;max-width:460px;margin:auto;
}
.card .art{
width:320px;max-width:100%;aspect-ratio:1.6;margin:0 auto 25px;
border-radius:8px;background:#0d0d0d center/cover no-repeat;
border:1px solid rgba(255,255,255,.08);
display:flex;align-items:center;justify-content:center;
font-family:'Pixelify Sans',sans-serif;font-size:30px;letter-spacing:4px;color:#888;
}
.amount-label{display:none;color:#666;font-size:11px;margin-bottom:4px}
.card .name{font-size:26px;margin-bottom:20px}
.amounts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.amounts button{
padding:10px 14px;min-width:70px;
background:#111;color:#fff;
border:1px solid rgba(255,255,255,.15);
font-family:inherit;font-size:15px;cursor:pointer;
}
.amounts button.on{background:#fff;color:#000}
.custom{
display:none;margin:0 auto 20px;width:200px;
background:transparent;color:#fff;text-align:center;
border:none;border-bottom:1px solid rgba(255,255,255,.25);
font-family:inherit;font-size:24px;padding:6px;outline:none;
}
.breakdown{color:#777;font-size:13px;line-height:1.9;margin-bottom:6px}
.breakdown b{color:#fff;font-weight:500}
.total{font-size:28px;margin:10px 0 6px}
.eta{color:#777;margin-bottom:28px;font-size:13px}
.pay{
width:260px;max-width:100%;padding:14px;
background:#fff;color:#000;border:none;cursor:pointer;
font-family:inherit;font-size:15px;
}
.pay:disabled{opacity:.4;cursor:default}
.express{width:260px;max-width:100%;margin:0 auto;display:none}
.express.on{display:block}
.mock-wallet{
display:block;width:100%;height:48px;margin-bottom:8px;border:none;border-radius:6px;
font-family:-apple-system,system-ui,sans-serif;font-size:17px;font-weight:600;cursor:pointer;
}
.or{display:none;color:#555;font-size:11px;margin:14px auto;width:260px;max-width:100%;
align-items:center;gap:10px}
.or.on{display:flex}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
.pay.secondary{background:#111;color:#fff;border:1px solid rgba(255,255,255,.15)}
.pay-crypto{
display:none;width:260px;max-width:100%;padding:13px;margin-top:10px;
background:#111;color:#fff;border:1px solid rgba(255,255,255,.15);cursor:pointer;
font-family:inherit;font-size:14px;
}
.pay-crypto:disabled{opacity:.4;cursor:default}
.crypto-box{display:none;margin:14px auto 0;width:260px;max-width:100%}
.crypto-box input{
width:100%;padding:11px;background:transparent;color:#fff;
border:1px solid rgba(255,255,255,.2);font-family:inherit;font-size:13px;outline:none;text-align:center;
}
.crypto-box .hint{color:#666;font-size:11px;margin:8px 0;line-height:1.6}
.crypto-box button{
width:100%;padding:12px;background:#fff;color:#000;border:none;cursor:pointer;
font-family:inherit;font-size:14px;
}
.methods{margin-top:12px;color:#555;font-size:11px}
.back{
margin-top:22px;background:none;border:none;color:#666;
font-family:inherit;font-size:12px;cursor:pointer;
}
.back:hover{color:#fff}
.error{color:#ff6b6b;font-size:13px;margin-top:14px;min-height:16px}

@media (max-width:600px){
.tiles{grid-template-columns:repeat(2,1fr);gap:10px}
.logo{font-size:44px;letter-spacing:10px}
#search,.placeholder{font-size:20px}
.card{padding:28px 18px}
}
</style>
<script src="https://js.stripe.com/v3/" async></script>
</head>

<body>

<div class="container">

<div class="logo" id="home">NOIR</div>
<div class="tagline">Gift cards. Delivered instantly.</div>

<!-- search view -->
<div id="searchView">
  <div class="search-wrap">
    <div class="placeholder" id="placeholder">
      <span id="typewriter"></span><span class="cursor">_</span>
    </div>
    <input id="search" autocomplete="off" spellcheck="false" aria-label="Search gift cards">
    <div class="suggestions" id="suggestions"></div>
  </div>
  <div class="status" id="status"></div>
  <div class="tiles loading" id="tiles" aria-label="Popular gift cards"></div>
  <div class="brands">100+ brands · type any brand above</div>
</div>

<!-- product view -->
<div class="card" id="card">
  <div class="art" id="art"></div>
  <div class="name" id="name"></div>
  <div class="amounts" id="amounts"></div>
  <div class="amount-label" id="amountLabel">AMOUNT (USD)</div>
  <input class="custom" id="custom" inputmode="decimal" placeholder="$0">
  <div class="breakdown" id="breakdown"></div>
  <div class="eta">Delivered in under 30 seconds</div>
  <div class="express" id="express"></div>
  <div class="or" id="or">or</div>
  <button class="pay" id="pay" disabled>Choose an amount</button>
  <button class="pay-crypto" id="payCrypto" disabled>Pay with crypto · BTC/ETH</button>
  <div class="crypto-box" id="cryptoBox">
    <input id="cryptoEmail" type="email" placeholder="your@email.com" autocomplete="email">
    <div class="hint">Your code is emailed once the payment confirms on the blockchain.</div>
    <button id="cryptoGo">Continue to crypto payment</button>
  </div>
  <div class="methods">Secure payments by Stripe</div>
  <div class="error" id="error"></div>
  <button class="back" id="back">← back</button>
</div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const input = $("search");
const placeholder = $("placeholder");
const typewriter = $("typewriter");
const suggestions = $("suggestions");

/* ---------- typewriter (unchanged) ---------- */
const phrases = ["amazon $100","steam $50","fortnite $20","roblox $25","xbox $50","playstation $100"];
let phraseIndex = 0, charIndex = 0, deleting = false;

function animateText(){
  if(input.value.length > 0){ typewriter.textContent = ""; setTimeout(animateText, 300); return; }
  const current = phrases[phraseIndex];
  if(!deleting){
    typewriter.textContent = current.substring(0, charIndex + 1);
    charIndex++;
    if(charIndex === current.length){ deleting = true; setTimeout(animateText, 1500); return; }
  }else{
    typewriter.textContent = current.substring(0, charIndex - 1);
    charIndex--;
    if(charIndex === 0){ deleting = false; phraseIndex = (phraseIndex + 1) % phrases.length; }
  }
  setTimeout(animateText, deleting ? 45 : 85);
}
animateText();

/* ---------- catalog ---------- */
let catalog = null;
let catalogPromise = null;
let cryptoOn = false;
let stripeKey = null;

/* Preview mode: when you open this file by double-clicking it (file:///),
   there's no backend, so show sample cards. Checkout only works on noirgc.com. */
const PREVIEW = location.protocol === "file:";
const SAMPLE = [
  { id: 1, name: "Amazon US", brand: "Amazon", logo: null, type: "fixed", amounts: [10, 25, 50, 100] },
  { id: 2, name: "Steam USA", brand: "Steam", logo: null, type: "fixed", amounts: [20, 50, 100] },
  { id: 3, name: "Fortnite V-Bucks US", brand: "Fortnite", logo: null, type: "fixed", amounts: [10, 25, 50, 100] },
  { id: 4, name: "Roblox US", brand: "Roblox", logo: null, type: "range", min: 10, max: 100 },
  { id: 5, name: "Xbox US", brand: "Xbox", logo: null, type: "fixed", amounts: [15, 25, 50, 100] },
  { id: 6, name: "PlayStation Store US", brand: "PlayStation", logo: null, type: "fixed", amounts: [10, 25, 50, 100] },
  { id: 7, name: "Nintendo eShop US", brand: "Nintendo", logo: null, type: "fixed", amounts: [20, 35, 50] },
  { id: 8, name: "Apple Gift Card US", brand: "Apple", logo: null, type: "range", min: 10, max: 100 }
];

function loadCatalog(){
  if(PREVIEW){ catalog = SAMPLE; cryptoOn = true; return Promise.resolve(SAMPLE); }
  if(!catalogPromise){
    catalogPromise = fetch("/api/products")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => { cryptoOn = !!d.crypto; stripeKey = d.stripeKey || null; return (catalog = d.products); })
      .catch(() => {
        catalogPromise = null;
        $("status").textContent = "Store is offline right now — try again in a minute.";
        return [];
      });
  }
  return catalogPromise;
}
loadCatalog().then(renderTiles);

/* ---------- popular brand tiles ---------- */
const FEATURED = ["Roblox", "Steam", "Fortnite", "Xbox", "PlayStation", "Nintendo", "Apple", "Amazon"];

function renderTiles(){
  const box = $("tiles");
  box.innerHTML = "";
  box.classList.toggle("loading", !catalog);
  FEATURED.forEach(name => {
    const p = catalog ? search(name)[0] : null;
    if(catalog && !p) return;                // not in stock -> no tile
    const b = document.createElement("button");
    b.className = "tile";
    b.type = "button";
    const face = document.createElement("div");
    face.className = "face";
    if(p && p.logo) face.style.backgroundImage = `url("${p.logo.replace(/"/g, "%22")}")`;
    else face.textContent = name.toUpperCase();
    const label = document.createElement("div");
    label.textContent = name;
    b.append(face, label);
    b.setAttribute("aria-label", name + " gift card");
    b.addEventListener("click", async () => {
      await loadCatalog();
      const hit = search(name)[0];
      if(hit) openProduct(hit, null);
    });
    box.appendChild(b);
  });
  box.style.display = catalog && !box.children.length ? "none" : "";
}

/* searches that find nothing are logged (Vercel Logs: SEARCH_MISS) so you know what to stock */
let missTimer = null;
function logMiss(q){
  if(PREVIEW) return;
  clearTimeout(missTimer);
  missTimer = setTimeout(() => {
    try{ navigator.sendBeacon("/api/miss", JSON.stringify({ q })); }catch(e){}
  }, 1500);
}

const norm = (s) => s.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

function parseQuery(q){
  const amount = Number((q.match(/\d+(\.\d{1,2})?/) || [])[0]) || null;
  const words = norm(q.replace(/\$?\d+(\.\d+)?/g, " ")).split(" ").filter(Boolean)
    .filter(w => !["gift","card","cards","usd","us"].includes(w));
  return { amount, words };
}

function search(q){
  if(!catalog) return [];
  const { words } = parseQuery(q);
  if(!words.length) return [];
  return catalog
    .map(p => {
      const hay = norm(p.name + " " + p.brand);
      let score = 0;
      for(const w of words){
        if(!hay.includes(w)) return null;
        score += hay.startsWith(w) ? 3 : (" " + hay).includes(" " + w) ? 2 : 1;
      }
      // prefer plain US cards over regional variants
      score -= p.name.length / 100;
      return { p, score };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score)
    .slice(0, 6)
    .map(x => x.p);
}

/* ---------- suggestions ---------- */
let current = [];
let active = 0;

function renderSuggestions(){
  const q = input.value.trim();
  current = q ? search(q) : [];
  active = 0;
  suggestions.innerHTML = "";
  current.forEach((p, i) => {
    const b = document.createElement("button");
    if(i === 0) b.className = "active";
    const img = document.createElement("img");
    if(p.logo) img.src = p.logo;
    img.alt = "";
    const span = document.createElement("span");
    span.textContent = p.name;
    b.append(img, span);
    b.addEventListener("mousedown", (e) => { e.preventDefault(); openProduct(p, parseQuery(q).amount); });
    suggestions.appendChild(b);
  });
  suggestions.style.display = current.length ? "block" : "none";
  const miss = q && catalog && !current.length && parseQuery(q).words.length;
  $("status").textContent = miss ? "No gift card found for that — try another brand." : "";
  if(miss) logMiss(q);
}

input.addEventListener("input", () => {
  placeholder.style.display = input.value.length ? "none" : "block";
  if(!catalog){
    $("status").textContent = "Loading cards…";
    loadCatalog().then(renderSuggestions);
  }
  else renderSuggestions();
});

input.addEventListener("keydown", async (e) => {
  if(e.key === "ArrowDown" || e.key === "ArrowUp"){
    if(!current.length) return;
    e.preventDefault();
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + current.length) % current.length;
    [...suggestions.children].forEach((b, i) => b.classList.toggle("active", i === active));
  }
  if(e.key === "Enter"){
    const q = input.value.trim();
    if(!q) return;
    await loadCatalog();
    if(!current.length) renderSuggestions();
    if(current.length) openProduct(current[active], parseQuery(q).amount);
  }
});

input.addEventListener("blur", () => setTimeout(() => (suggestions.style.display = "none"), 100));
input.addEventListener("focus", () => { if(current.length) suggestions.style.display = "block"; });

/* ---------- product view ---------- */
let product = null;
let amount = null;
let quoteTimer = null;

function openProduct(p, wanted){
  product = p;
  $("searchView").style.display = "none";
  $("card").style.display = "block";
  const art = $("art");
  art.style.backgroundImage = p.logo ? `url("${p.logo.replace(/"/g, "%22")}")` : "none";
  art.textContent = p.logo ? "" : p.brand.toUpperCase();
  $("name").textContent = p.name;
  $("error").textContent = "";
  $("payCrypto").style.display = cryptoOn ? "inline-block" : "none";
  $("cryptoBox").style.display = "none";

  const amounts = $("amounts");
  amounts.innerHTML = "";
  const custom = $("custom");

  if(p.type === "fixed"){
    custom.style.display = "none";
    $("amountLabel").style.display = "none";
    p.amounts.forEach(a => {
      const b = document.createElement("button");
      b.textContent = "$" + a;
      b.addEventListener("click", () => selectAmount(a));
      amounts.appendChild(b);
    });
    // pick the closest amount to what they typed
    const pick = wanted
      ? p.amounts.reduce((best, a) => Math.abs(a - wanted) < Math.abs(best - wanted) ? a : best, p.amounts[0])
      : null;
    selectAmount(pick);
  }else{
    custom.style.display = "block";
    $("amountLabel").style.display = "block";
    custom.placeholder = `$${p.min} – $${p.max}`;
    custom.value = wanted && wanted >= p.min && wanted <= p.max ? wanted : "";
    custom.oninput = () => selectAmount(Number(custom.value.replace(/[^0-9.]/g, "")) || null);
    selectAmount(Number(custom.value) || null);
  }
  history.pushState({ view: "card" }, "", "#" + p.id);
}

function selectAmount(a){
  amount = a;
  [...$("amounts").children].forEach(b => b.classList.toggle("on", b.textContent === "$" + a));
  const pay = $("pay");
  const breakdown = $("breakdown");
  $("error").textContent = "";

  const ok = a && (product.type === "fixed" ? product.amounts.includes(a) : a >= product.min && a <= product.max);
  $("payCrypto").disabled = !ok;
  showExpress(false);
  if(!ok){
    $("cryptoBox").style.display = "none";
    pay.disabled = true;
    pay.textContent = product.type === "range" && a ? `Enter $${product.min} – $${product.max}` : "Choose an amount";
    breakdown.innerHTML = "";
    return;
  }
  pay.disabled = true;
  pay.textContent = "…";
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(async () => {
    try{
      let q;
      if(PREVIEW){
        const total = Math.ceil((a * 1.05 + 0.99) * 100) / 100;
        q = { face: a, fee: total - a, total };
      }else{
        const r = await fetch(`/api/quote?productId=${product.id}&amount=${a}`);
        q = await r.json();
        if(!r.ok) throw new Error(q.error);
      }
      if(amount !== a) return;
      breakdown.innerHTML =
        `Gift card <b>$${q.face.toFixed(2)}</b> &nbsp;·&nbsp; Service fee <b>$${q.fee.toFixed(2)}</b>`;
      pay.disabled = false;
      const wallets = await showExpress(true, Math.round(q.total * 100), a);
      pay.classList.toggle("secondary", wallets);
      pay.textContent = wallets ? `Pay with card · $${q.total.toFixed(2)}` : `Pay $${q.total.toFixed(2)}`;
    }catch(err){
      pay.textContent = "Unavailable";
      $("error").textContent = err.message || "Couldn't get a price.";
    }
  }, 250);
}

$("pay").addEventListener("click", async () => {
  const pay = $("pay");
  if(PREVIEW){
    $("error").textContent = "Preview mode — checkout works once these files are live on noirgc.com.";
    return;
  }
  pay.disabled = true;
  pay.textContent = "Opening checkout…";
  try{
    const r = await fetch("/api/checkout", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ productId: product.id, amount })
    });
    const d = await r.json();
    if(!r.ok || !d.url) throw new Error(d.error);
    location.href = d.url;
  }catch(err){
    $("error").textContent = err.message || "Checkout isn't available right now.";
    selectAmount(amount);
  }
});

$("payCrypto").addEventListener("click", () => {
  const box = $("cryptoBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
  if(box.style.display === "block") $("cryptoEmail").focus();
});

async function cryptoCheckout(){
  const email = $("cryptoEmail").value.trim();
  const go = $("cryptoGo");
  $("error").textContent = "";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    $("error").textContent = "Enter your email — that's where the code is sent.";
    return;
  }
  if(PREVIEW){
    $("error").textContent = "Preview mode — crypto checkout works once these files are live on noirgc.com.";
    return;
  }
  go.disabled = true;
  go.textContent = "Opening…";
  try{
    const r = await fetch("/api/crypto-checkout", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ productId: product.id, amount, email })
    });
    const d = await r.json();
    if(!r.ok || !d.url) throw new Error(d.error);
    location.href = d.url;
  }catch(err){
    $("error").textContent = err.message || "Crypto checkout isn't available right now.";
  }finally{
    go.disabled = false;
    go.textContent = "Continue to crypto payment";
  }
}
$("cryptoGo").addEventListener("click", cryptoCheckout);
$("cryptoEmail").addEventListener("keydown", (e) => { if(e.key === "Enter") cryptoCheckout(); });

/* ---------- Apple Pay / Google Pay / Link, right on the page ---------- */
let stripeJs = null, elements = null, express = null;
let walletsAvailable = false;
let expressAmount = null; // the gift card amount the wallet sheet is charging for
let walletsKnown = null;  // resolves once Stripe knows which buttons this device can show

function showExpress(on, cents, giftAmount){
  const box = $("express");
  if(!on){ box.classList.remove("on"); $("or").classList.remove("on"); return Promise.resolve(false); }
  expressAmount = giftAmount;

  if(PREVIEW){
    if(!box.children.length){
      box.innerHTML =
        '<button class="mock-wallet" style="background:#fff;color:#000">Apple Pay</button>' +
        '<button class="mock-wallet" style="background:#fff;color:#000">Google Pay</button>';
      [...box.children].forEach(b => b.onclick = () =>
        ($("error").textContent = "Preview mode — Apple Pay and Google Pay work once the site is live with Stripe keys."));
    }
    box.classList.add("on"); $("or").classList.add("on");
    return Promise.resolve(true);
  }

  if(!stripeKey || !window.Stripe) return Promise.resolve(false);
  if(!elements){
    stripeJs = Stripe(stripeKey);
    elements = stripeJs.elements({ mode: "payment", amount: cents, currency: "usd", appearance: { theme: "night" } });
    express = elements.create("expressCheckout", {
      emailRequired: true, // the code is emailed, and wallets don't share email unless asked
      buttonType: { applePay: "buy", googlePay: "buy" },
      buttonTheme: { applePay: "white", googlePay: "white" },
      buttonHeight: 48,
      layout: { maxColumns: 1, maxRows: 4, overflow: "auto" }
    });
    walletsKnown = new Promise(resolve => {
      express.on("ready", ({ availablePaymentMethods }) => {
        walletsAvailable = !!availablePaymentMethods && Object.values(availablePaymentMethods).some(Boolean);
        resolve(walletsAvailable);
      });
      setTimeout(() => resolve(walletsAvailable), 4000);
    });
    express.on("confirm", onWalletConfirm);
    express.mount("#express");
  }else{
    elements.update({ amount: cents });
  }
  return walletsKnown.then(has => {
    box.classList.toggle("on", has);
    $("or").classList.toggle("on", has);
    return has;
  });
}

async function onWalletConfirm(event){
  $("error").textContent = "";
  const fail = (msg) => {
    $("error").textContent = msg;
    try{ event.paymentFailed({ reason: "fail" }); }catch(e){}
  };
  const { error: submitError } = await elements.submit();
  if(submitError) return fail(submitError.message);

  let clientSecret;
  try{
    const r = await fetch("/api/intent", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ productId: product.id, amount: expressAmount, email: event.billingDetails?.email })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error);
    clientSecret = d.clientSecret;
  }catch(err){
    return fail(err.message || "Payment isn't available right now.");
  }

  const { error, paymentIntent } = await stripeJs.confirmPayment({
    elements,
    clientSecret,
    confirmParams: { return_url: location.origin + "/success.html" },
    redirect: "if_required"
  });
  if(error) return fail(error.message);
  location.href = "/success.html?payment_intent=" + encodeURIComponent(paymentIntent.id);
}

function showSearch(){
  $("card").style.display = "none";
  $("searchView").style.display = "block";
  input.focus();
}
$("back").addEventListener("click", () => history.back());
$("home").addEventListener("click", () => { if($("card").style.display === "block") history.back(); });
window.addEventListener("popstate", showSearch);
</script>
