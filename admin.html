<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ID review — NOIR</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
main{max-width:1100px}
.req{border:1px solid rgba(255,255,255,.18);padding:20px;margin:18px 0}
.req h3{margin:0 0 4px;font-size:16px}
.meta{color:#888;font-size:12px;margin-bottom:14px;line-height:1.7}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.photos figure{margin:0}
.photos img{width:100%;max-height:420px;object-fit:contain;background:#111;border:1px solid rgba(255,255,255,.12);cursor:zoom-in}
.photos figcaption{color:#777;font-size:11px;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row input,.row select{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.25);padding:10px;font-family:inherit;font-size:13px}
.row select option{background:#000}
button.act{padding:10px 16px;font-family:inherit;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.25);background:none;color:#fff}
button.ok{background:#fff;color:#000;border-color:#fff}
button:disabled{opacity:.5}
.msg{font-size:12px;margin-top:10px;color:#e66}
.note{color:#888;font-size:12px;line-height:1.7}
.big{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
.big img{max-width:96vw;max-height:96vh}
@media(max-width:700px){.photos{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><a href="index.html">NOIR</a></header>
<main>
<h1>ID review</h1>
<p class="note" id="who">Loading…</p>
<div id="list"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let reasons = {};

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (e.className = v) : (e[k] = v);
  for (const k of kids) e.append(k);
  return e;
}

async function load() {
  const r = await fetch("/api/admin", { cache: "no-store" });
  const d = await r.json().catch(() => ({}));
  const list = $("list");
  list.innerHTML = "";
  if (!r.ok) {
    $("who").textContent = "This page is only for NOIR staff. Sign in on the store with an admin email, then come back.";
    list.append(el("p", {}, el("a", { href: "index.html" }, "Go to the store to sign in")));
    return;
  }
  reasons = d.reasons || {};
  $("who").textContent = `Signed in as ${d.admin}. ${d.pending.length ? d.pending.length + " waiting." : "Nothing waiting."} ` +
    "Check the photo is a real, unexpired ID, the selfie is the same person, and the name matches what they typed. Photos are deleted as soon as you decide.";
  for (const req of d.pending) list.append(card(req));
}

function card(req) {
  const photo = (which, label) => {
    const img = el("img", { src: `/api/admin?photo=${req.id}&which=${which}`, alt: label });
    img.onclick = () => { const b = el("div", { class: "big" }, el("img", { src: img.src })); b.onclick = () => b.remove(); document.body.append(b); };
    return el("figure", {}, img, el("figcaption", {}, label));
  };
  const idNum = el("input", { placeholder: "ID number from the photo", autocomplete: "off", size: 24 });
  const ok = el("button", { class: "act ok", textContent: "Approve" });
  const why = el("select", {}, el("option", { value: "", textContent: "Reject because…" }),
    ...Object.entries(reasons).map(([k, v]) => el("option", { value: k, textContent: v })));
  const no = el("button", { class: "act", textContent: "Reject" });
  const msg = el("div", { class: "msg" });
  const box = el("div", { class: "req" },
    el("h3", {}, req.name),
    el("div", { class: "meta" }, `${req.email} · ${req.idTypeLabel} · sent ${new Date(req.submitted).toLocaleString()}`),
    el("div", { class: "photos" }, photo("id", "ID"), photo("selfie", "Selfie holding the ID")),
    el("div", { class: "row" }, idNum, ok, why, no),
    msg);
  const send = async (payload, btn) => {
    msg.textContent = "";
    ok.disabled = no.disabled = true;
    try {
      const r = await fetch("/api/admin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: req.id, ...payload }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Something went wrong.");
      box.replaceChildren(el("div", { class: "note" }, `${req.name}: ${payload.approve ? "approved" : "rejected"}. Photos deleted and they've been emailed.`));
    } catch (e) {
      msg.textContent = e.message;
      ok.disabled = no.disabled = false;
    }
  };
  ok.onclick = () => send({ approve: true, idNumber: idNum.value }, ok);
  no.onclick = () => { if (!why.value) { msg.textContent = "Choose a reason first."; return; } send({ approve: false, reason: why.value }, no); };
  return box;
}
load();
</script>
</body>
</html>
