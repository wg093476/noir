<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>NOIR — Your gift card</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#000;color:#fff;min-height:100vh;
display:flex;flex-direction:column;align-items:center;
font-family:'JetBrains Mono',monospace;text-align:center;
}
.wrap{width:90%;max-width:520px;flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:40px}
.logo{
font-family:'Pixelify Sans',sans-serif;font-size:44px;letter-spacing:10px;
margin-bottom:30px;text-shadow:0 0 10px rgba(255,255,255,.15);
}
.logo a{color:inherit;text-decoration:none}
.box{border:1px solid rgba(255,255,255,.15);padding:36px 28px}
.art{width:260px;max-width:100%;aspect-ratio:1.6;object-fit:cover;border-radius:8px;margin-bottom:20px;display:none}
.title{font-size:22px;margin-bottom:8px}
.sub{color:#777;font-size:13px;line-height:1.7}
.code{
margin:24px 0 8px;padding:18px;
border-top:1px solid rgba(255,255,255,.15);border-bottom:1px solid rgba(255,255,255,.15);
font-size:22px;letter-spacing:2px;word-break:break-all;
}
.label{color:#666;font-size:11px;margin-top:14px}
.copy{
margin-top:10px;padding:10px 18px;background:#fff;color:#000;border:none;
font-family:inherit;font-size:13px;cursor:pointer;
}
.redeem{color:#888;font-size:12px;margin-top:22px;line-height:1.7}
.redeem a{color:#fff}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.home{display:inline-block;margin-top:24px;color:#666;font-size:12px;text-decoration:none}
.home:hover{color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><a href="/">NOIR</a></div>
  <div class="box" id="box">
    <div class="title">Payment received</div>
    <div class="sub">Getting your gift card<span class="dots"></span></div>
  </div>
  <a class="home" href="/">← back to NOIR</a>
</div>

<script>
const box = document.getElementById("box");
const params = new URLSearchParams(location.search);
const sessionId = params.get("session_id");
const intentId = params.get("payment_intent");
const orderQuery = sessionId ? "session_id=" + encodeURIComponent(sessionId)
  : intentId ? "payment_intent=" + encodeURIComponent(intentId) : null;
const started = Date.now();

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

function message(title, sub){
  box.innerHTML = "";
  box.append(el("div", "title", title), el("div", "sub", sub));
}

function showCard(d){
  box.innerHTML = "";
  if(d.logo){ const img = el("img", "art"); img.src = d.logo; img.alt = ""; img.style.display = "inline-block"; box.append(img); }
  box.append(el("div", "title", `${d.name} — $${d.amount}`));
  box.append(el("div", "sub", d.email ? `A copy was also sent to ${d.email}` : "Save this code somewhere safe."));

  d.cards.forEach(c => {
    if(c.code){
      box.append(el("div", "label", "CODE"), el("div", "code", c.code));
      const btn = el("button", "copy", "Copy code");
      btn.onclick = () => navigator.clipboard.writeText(c.code).then(() => (btn.textContent = "Copied ✓"));
      box.append(btn);
    }
    if(c.pin){ box.append(el("div", "label", "PIN"), el("div", "code", c.pin)); }
    if(c.url){
      const p = el("div", "redeem");
      const a = el("a", null, "Open redemption link");
      a.href = c.url; a.target = "_blank"; a.rel = "noopener";
      p.append(a); box.append(p);
    }
  });
  // Reloadly's text sometimes runs words together ("go toRoblox.com"), so add the missing space.
  if(d.redeem) box.append(el("div", "redeem", d.redeem.replace(/\b(to|at|visit|on)(?=[A-Z])/g, "$1 ")));
}

async function poll(){
  if(new URLSearchParams(location.search).get("crypto")){
    return message("Crypto payment sent",
      "Once the network confirms it — usually a few minutes for ETH, USDT and USDC, and 10–60 minutes for Bitcoin — your code is emailed to you automatically. You can close this page.");
  }
  if(params.get("redirect_status") === "failed"){
    return message("Payment didn't go through", "You haven't been charged. Go back and try again.");
  }
  if(!orderQuery){ message("Order not found", "This link is missing its order number."); return; }
  try{
    const r = await fetch("/api/order?" + orderQuery);
    const d = await r.json();
    if(d.state === "done") return showCard(d);
    if(d.state === "refunded")
      return message("We couldn't get that card", "Your payment has been refunded in full. It can take 5–10 days to show on your statement.");
    if(d.state === "unpaid")
      return message("Payment not finished", "It looks like checkout wasn't completed. You haven't been charged.");
    if(r.status === 400) return message("Order not found", d.error || "");
  }catch(e){ /* keep trying */ }

  if(Date.now() - started > 90000){
    message("Still working on it", "Your card is taking longer than usual. Keep this page open or refresh in a minute — the code will also be emailed to you.");
    setTimeout(poll, 10000);
  }else{
    setTimeout(poll, 2000);
  }
}
poll();
</script>
<script src="assets/site.js"></script>
</body>
</html>
